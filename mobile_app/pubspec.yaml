name: mobile_app
description: "SimAPI Android app - Turn your phone into an SMS gateway"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  socket_io_client: ^3.0.2
  shared_preferences: ^2.5.2
  permission_handler: ^11.4.0
  telephony: ^0.2.0
  flutter_riverpod: ^2.6.1
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
